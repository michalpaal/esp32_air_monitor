# Dashboard „Ovzdušie“ pre Air Monitor (len vstavané karty, bez HACS)
#
# Inštalácia:
#   Nastavenia → Dashboardy → Pridať dashboard → „Nový dashboard od začiatku“
#   (názov Ovzdušie, URL dashboard-ovzdusie, ikona mdi:air-filter) → otvor ho → ceruzka → ⋮ →
#   „Editor surovej konfigurácie“ → vlož celý tento súbor → Uložiť.
#
# Vyžaduje package homeassistant/packages/air_monitor.yaml (hodinové priemery, EAQI, CO2 hodnotenie).
#
# Rozloženie: horný pás odznakov = rýchly prehľad, pod ním tri stĺpce podľa témy
# (CO₂ | prachové častice | teplota a vlhkosť), každý s aktuálnou hodnotou a grafom za 24 h.
# Dlhodobé štatistiky sú na samostatnej karte „Štatistiky“.

title: Ovzdušie
views:
  # ═════════════ Prehľad ═════════════
  - title: Prehľad
    path: prehlad
    icon: mdi:air-filter
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: sensor.air_monitor_kvalita_ovzdusia
        name: Ovzdušie
        show_name: true
        color: green
      - type: entity
        entity: sensor.air_monitor_co2
        name: CO₂
        show_name: true
        color: blue
      - type: entity
        entity: sensor.air_monitor_temperature
        name: Teplota
        show_name: true
        color: red
      - type: entity
        entity: sensor.air_monitor_humidity
        name: Vlhkosť
        show_name: true
        color: cyan
      - type: entity
        entity: binary_sensor.air_monitor_vyvetrat
        name: Vyvetrať
        show_name: true
        color: amber
        visibility:
          - condition: state
            entity: binary_sensor.air_monitor_vyvetrat
            state: "on"
    sections:
      # ───────────── CO₂ ─────────────
      - type: grid
        cards:
          - type: heading
            heading: CO₂
            icon: mdi:molecule-co2
          - type: gauge
            entity: sensor.air_monitor_co2
            name: Aktuálne
            min: 400
            max: 2000
            needle: true
            segments:
              - { from: 400, color: "#2e7d32", label: Výborné }
              - { from: 800, color: "#7cb342", label: Dobré }
              - { from: 1000, color: "#f9a825", label: Zvýšené }
              - { from: 1400, color: "#c62828", label: Vysoké }
            grid_options: { columns: 12 }
          - type: tile
            entity: sensor.air_monitor_co2_hodnotenie
            name: Hodnotenie
            color: blue
            grid_options: { columns: 6 }
          - type: tile
            entity: binary_sensor.air_monitor_vyvetrat
            name: Vyvetrať
            color: amber
            grid_options: { columns: 6 }
          - type: history-graph
            title: Posledných 24 h
            hours_to_show: 24
            entities:
              - entity: sensor.air_monitor_co2
                name: CO₂
            grid_options: { columns: 12 }

      # ───────────── Prachové častice ─────────────
      - type: grid
        cards:
          - type: heading
            heading: Prachové častice
            icon: mdi:blur
          - type: tile
            entity: sensor.air_monitor_kvalita_ovzdusia
            name: Kvalita ovzdušia (EAQI, priemer za 1 h)
            color: green
            grid_options: { columns: 12 }
          # Farby budíkov = pásma EAQI (EEA), orientačne pre okamžitú hodnotu
          - type: gauge
            entity: sensor.air_monitor_pm2_5
            name: PM2.5
            min: 0
            max: 150
            needle: true
            segments:
              - { from: 0, color: "#50f0e6", label: Dobrá }
              - { from: 5.5, color: "#50ccaa", label: Prijateľná }
              - { from: 15.5, color: "#f0e641", label: Stredná }
              - { from: 50.5, color: "#ff5050", label: Zlá }
              - { from: 90.5, color: "#960032", label: Veľmi zlá }
              - { from: 140.5, color: "#7d2181", label: Extrémne zlá }
            grid_options: { columns: 6 }
          - type: gauge
            entity: sensor.air_monitor_pm10
            name: PM10
            min: 0
            max: 300
            needle: true
            segments:
              - { from: 0, color: "#50f0e6", label: Dobrá }
              - { from: 15.5, color: "#50ccaa", label: Prijateľná }
              - { from: 45.5, color: "#f0e641", label: Stredná }
              - { from: 120.5, color: "#ff5050", label: Zlá }
              - { from: 195.5, color: "#960032", label: Veľmi zlá }
              - { from: 270.5, color: "#7d2181", label: Extrémne zlá }
            grid_options: { columns: 6 }
          - type: history-graph
            title: Posledných 24 h
            hours_to_show: 24
            entities:
              - entity: sensor.air_monitor_pm1_0
                name: PM1.0
              - entity: sensor.air_monitor_pm2_5
                name: PM2.5
              - entity: sensor.air_monitor_pm10
                name: PM10
            grid_options: { columns: 12 }

      # ───────────── Teplota a vlhkosť ─────────────
      - type: grid
        cards:
          - type: heading
            heading: Teplota a vlhkosť
            icon: mdi:home-thermometer
          - type: tile
            entity: sensor.air_monitor_temperature
            name: Teplota
            color: red
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.air_monitor_humidity
            name: Vlhkosť
            color: cyan
            grid_options: { columns: 6 }
          - type: history-graph
            title: Teplota – 24 h
            hours_to_show: 24
            entities:
              - entity: sensor.air_monitor_temperature
                name: Teplota
            grid_options: { columns: 12 }
          - type: history-graph
            title: Vlhkosť – 24 h
            hours_to_show: 24
            entities:
              - entity: sensor.air_monitor_humidity
                name: Vlhkosť
            grid_options: { columns: 12 }

  # ═════════════ Dlhodobé štatistiky ═════════════
  - title: Štatistiky
    path: statistiky
    icon: mdi:chart-box-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: CO₂ a prachové častice (30 dní)
            icon: mdi:chart-line
          - type: statistics-graph
            title: CO₂ – denný priemer a maximum
            entities:
              - entity: sensor.air_monitor_co2
                name: CO₂
            stat_types: [mean, max]
            period: day
            days_to_show: 30
            chart_type: line
            grid_options: { columns: 12 }
          - type: statistics-graph
            title: PM2.5 a PM10 – denný priemer
            entities:
              - entity: sensor.air_monitor_pm2_5
                name: PM2.5
              - entity: sensor.air_monitor_pm10
                name: PM10
            stat_types: [mean]
            period: day
            days_to_show: 30
            chart_type: line
            grid_options: { columns: 12 }
      - type: grid
        cards:
          - type: heading
            heading: Teplota a vlhkosť (30 dní)
            icon: mdi:chart-line
          - type: statistics-graph
            title: Teplota – denné minimum, priemer, maximum
            entities:
              - entity: sensor.air_monitor_temperature
                name: Teplota
            stat_types: [min, mean, max]
            period: day
            days_to_show: 30
            chart_type: line
            grid_options: { columns: 12 }
          - type: statistics-graph
            title: Vlhkosť – denný priemer
            entities:
              - entity: sensor.air_monitor_humidity
                name: Vlhkosť
            stat_types: [mean]
            period: day
            days_to_show: 30
            chart_type: line
            grid_options: { columns: 12 }
